# Rebuilds summary.json when results change by any other route than the
# validation workflow (which rebuilds it in its own commit): chiefly the
# release baselines that NeoSCAD's release workflow pushes with its
# BENCHMARKS_TOKEN. Pushes made with this repository's GITHUB_TOKEN do not
# start workflows, so the validation's own commits never loop back here.
name: Summary

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "scripts/summarize.py"
      - "scripts/benchlib.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Rebuild summary.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python scripts/summarize.py
            git add summary.json
            if git diff --cached --quiet; then
              echo "summary.json is up to date"
              exit 0
            fi
            git commit --quiet -m "Rebuild summary.json"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push summary.json"
          exit 1
